# Render blueprint for the RLECD site.
#
# Render is the only deploy target. It runs a normal Linux image with standard
# pip and a real WSGI process, so the compiled psycopg-binary wheel installs and
# imports cleanly. Render also sets RENDER=1, which is what settings.py and
# scripts/preflight.py key off to allow the generated *.onrender.com hostname and
# to refuse DEBUG on a live service.
services:
  - type: web
    name: rlecd
    runtime: python
    plan: free
    # Standard pip against a real Linux image, so compiled wheels install and
    # import normally. collectstatic also proves the settings module and the
    # template/static paths are wired correctly before the service goes live.
    buildCommand: python scripts/check_python_version.py && pip install -r requirements.txt && python backend/manage.py collectstatic --noinput
    # Migrations run on every start. This is safe for a single instance, which
    # is what the free plan gives us; a multi-instance deploy would want
    # preDeployCommand instead so it runs once before traffic arrives.
    startCommand: python backend/manage.py migrate --noinput && gunicorn home_improvement.wsgi:application --chdir backend --workers 2 --timeout 120
    healthCheckPath: /admin/login/
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.14"
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      # The only value a deployer has to supply. No domain is required: the
      # service answers on its generated *.onrender.com hostname, which
      # settings.py allows automatically, and canonical/Open Graph tags are
      # derived from the incoming request. A custom domain can be attached
      # later, at which point ALLOWED_HOSTS and SITE_URL become the two
      # values worth setting.
      - key: DATABASE_URL
        sync: false
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: CSRF_COOKIE_SECURE
        value: "true"
      - key: SECURE_SSL_REDIRECT
        value: "true"
      - key: SECURE_HSTS_SECONDS
        value: "31536000"
      - key: SECURE_HSTS_INCLUDE_SUBDOMAINS
        value: "true"
      - key: SECURE_HSTS_PRELOAD
        value: "false"
