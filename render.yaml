# Render blueprint for the RLECD site.
#
# Render is the only deploy target. It runs a normal Linux image with standard
# pip and a real WSGI process, so the compiled psycopg-binary wheel installs and
# imports cleanly. Render also sets RENDER=1, which is what settings.py and
# scripts/preflight.py key off to allow the generated *.onrender.com hostname and
# to refuse DEBUG on a live service.
services:
  - type: web
    name: rlecd
    runtime: python
    plan: free
    # Standard pip against a real Linux image, so compiled wheels install and
    # import normally. collectstatic also proves the settings module and the
    # template/static paths are wired correctly before the service goes live.
    buildCommand: python scripts/check_python_version.py && pip install -r requirements.txt && python backend/manage.py collectstatic --noinput
    # Migrations run on every start. This is safe for a single instance, which
    # is what the free plan gives us; a multi-instance deploy would want
    # preDeployCommand instead so it runs once before traffic arrives.
    startCommand: python backend/manage.py migrate --noinput && gunicorn home_improvement.wsgi:application --chdir backend --workers 2 --timeout 120
    healthCheckPath: /admin/login/
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.14"
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      # The only value a deployer has to supply. No domain is required: the
      # service answers on its generated *.onrender.com hostname, which
      # settings.py allows automatically, and canonical/Open Graph tags are
      # derived from the incoming request. A custom domain can be attached
      # later, at which point ALLOWED_HOSTS and SITE_URL become the two
      # values worth setting.
      - key: DATABASE_URL
        sync: false
      # The web service queues lead notifications rather than sending them, so
      # it does not need these for the contact form to work -- a visitor is
      # never made to wait on SMTP. It does need them for the admin's
      # "send notification now" action on a lead, and because
      # scripts/preflight.py fails the deploy on the console backend. Same
      # values as the rlecd-send-outbox cron job below; Render prompts per
      # resource, so paste the same ones in both places.
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: CSRF_COOKIE_SECURE
        value: "true"
      - key: SECURE_SSL_REDIRECT
        value: "true"
      - key: SECURE_HSTS_SECONDS
        value: "31536000"
      - key: SECURE_HSTS_INCLUDE_SUBDOMAINS
        value: "true"
      - key: SECURE_HSTS_PRELOAD
        value: "false"

# Background work. Nothing on a request/response web service runs these, so a
# web service alone silently drops them: enquiry notifications would sit in
# the outbox as `queued` forever, and a page scheduled to publish in the future
# would never go live. Both commands are one-shot and safe to re-run, which is
# what a cron job needs.
#
# Note: Render Cron Jobs require a paid instance type, so the `plan` below is
# not `starter` for nothing. The web service can stay on `free`.
cronjobs:
  - type: cron
    name: rlecd-send-outbox
    schedule: "*/5 * * * *"
    command: python backend/manage.py send_outbox --limit 50
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: DEBUG
        value: "False"
      # The cron job inherits the mail configuration from here rather than
      # duplicating it, so there is one place to change when the provider or
      # password changes. Without these the job runs happily and writes every
      # notification to a log nobody reads.
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: ADMIN_EMAIL
        sync: false

  - type: cron
    name: rlecd-publish-due
    schedule: "*/10 * * * *"
    command: python backend/manage.py publish_due
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: DEBUG
        value: "False"
